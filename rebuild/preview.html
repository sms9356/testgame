<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>재건축 본관 미리보기</title>
<style>
  :root { --bg:#0b0c0e; --fg:#e8e4da; --mut:#9a968c; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,'Noto Sans KR',sans-serif; overflow:hidden; }
  #hud { position:fixed; left:12px; top:12px; background:rgba(0,0,0,.55); padding:10px 12px; border-radius:6px; font-size:13px; line-height:1.55; max-width:340px; }
  #hud b { color:#ffd27a; } #where { color:#9fe0a8; }
  #go { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.6); font-size:18px; cursor:pointer; }
</style></head>
<body>
<div id="hud"><b>재건축 본관 미리보기</b> (R4 · 본관 4층 + 별관 3층 + 연결 통로)<br>WASD 이동 · E 문 열기/닫기 · 마우스 시점 · Shift 달리기 · F 손전등 · L 형광등 켜기/끄기 · 1~4 층 이동<br><span id="where"></span></div>
<div id="hint" style="position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 12px;border-radius:5px;font-size:14px"></div>
<div id="go">클릭해서 시작</div>
<script type="module">
import * as THREE from '../vendor/three.module.js';
import { buildMainBuilding, buildWalkway, ANNEX_SPEC, ANNEX_PLAN } from './mainBuilding.js';
import { placeModels } from './models.js';
import { EffectComposer } from '../vendor/addons/postprocessing/EffectComposer.js';
import { RenderPass } from '../vendor/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from '../vendor/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from '../vendor/addons/postprocessing/OutputPass.js';
const R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 1.5)); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true; document.body.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a1820); scene.fog = new THREE.Fog(0x1a1820, 20, 140);
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, .05, 400);
const MAIN = buildMainBuilding();
// 별관: 본관 북쪽 20m, 180° 돌려 복도 · 현관이 본관을 마주 보게 — 1층 현관끼리 유리 연결 통로로 잇는다
const ANX = buildMainBuilding({ spec: ANNEX_SPEC, plan: ANNEX_PLAN, x: 0, z: -20, ry: Math.PI, name: 'REBUILD_ANNEX', label: '별관', prefix: '', signText: '서문고 별관 · 예술 실습동', classLabel: (f, n) => `3학년 ${n + 8}반` });
const WK = buildWalkway({ x1: -1.9, x2: 1.9, z1: -17.0, z2: -3.0 });
const BLD = [MAIN, ANX, WK];
BLD.forEach(b => { scene.add(b.root); if (b.models.length) placeModels(b.root, b.models, { shadows: false }); });
// 여러 건물을 하나처럼: 세계 좌표 → 각 건물 좌표로 바꿔 묻는다
const B = {
  spec: MAIN.spec, col: [],
  groundAt(x, z, feet) { let best = null; for (const b of BLD) { const [lx, lz] = b.toLocal(x, z), g = b.groundAt(lx, lz, feet); if (g != null && (best == null || g > best)) best = g; } return best; },
  blocked(x, z, y, r) { return BLD.some(b => { const [lx, lz] = b.toLocal(x, z); return b.col.some(c => !c.off && lx + r > c.x1 && lx - r < c.x2 && lz + r > c.z1 && lz - r < c.z2 && y + 1.7 > c.y1 + .001 && y + .35 < c.y2); }); },
  nearDoor(x, z, y) { let best = null, bd = 9; for (const b of BLD) { const [lx, lz] = b.toLocal(x, z), d = b.nearDoor(lx, lz, y); if (d) { const dd = Math.hypot(d.mx - lx, d.mz - lz); if (dd < bd) { bd = dd; best = d; } } } return best; },
  tickDoors(dt) { BLD.forEach(b => b.tickDoors(dt)); },
  lights: BLD.flatMap(b => b.lights.map(l => { const [x, z] = b.toWorld(l.x, l.z); return { x, y: l.y, z }; })),
  where(x, z, f) { for (const b of BLD) { const [lx, lz] = b.toLocal(x, z); const r = b.props.find(p => p.kind === 'room' && p.floor === f && lx > p.x1 && lx < p.x2 && lz > p.z1 && lz < p.z2); if (r) return b.name + ' ' + r.label; if (b.layout && lx > -b.layout.L / 2 && lx < b.layout.L / 2 && lz > b.layout.zN && lz < b.layout.zS) return b.name + (lz < 0 ? ' 복도' : ''); } return '바깥'; },
};
// 반사 환경: 형광등 줄이 달린 어두운 방을 PMREM 으로 구워 유리 · 니스 · 물갈기 바닥에 은은한 반사를 준다
{ const env = new THREE.Scene(), pm = new THREE.PMREMGenerator(R);
  env.add(new THREE.Mesh(new THREE.BoxGeometry(20, 6, 20), new THREE.MeshBasicMaterial({ color: 0x15161a, side: THREE.BackSide })));
  for (let i = -2; i <= 2; i++) { const l = new THREE.Mesh(new THREE.PlaneGeometry(1.2, .3), new THREE.MeshBasicMaterial({ color: 0xffffff })); l.position.set(i * 3.5, 2.9, 0); l.rotation.x = Math.PI / 2; env.add(l); }
  const win = new THREE.Mesh(new THREE.PlaneGeometry(16, 2), new THREE.MeshBasicMaterial({ color: 0x3a4660 })); win.position.set(0, 1.5, 9.9); win.rotation.y = Math.PI; env.add(win);
  scene.environment = pm.fromScene(env, .03).texture; scene.environmentIntensity = .3; }
R.shadowMap.type = THREE.PCFSoftShadowMap;
scene.add(new THREE.HemisphereLight(0x8890a8, 0x2a2420, .35));
const moon = new THREE.DirectionalLight(0xb0b8d8, .9); moon.position.set(-30, 60, 40); moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048); Object.assign(moon.shadow.camera, { left: -60, right: 60, top: 30, bottom: -30, far: 160 }); moon.shadow.bias = -.0006; scene.add(moon);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x3a3a34, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -.26; scene.add(ground);
// 형광등: 가까운 것만 실제 광원 (예산 10개)
const pool = Array.from({ length: 10 }, () => { const l = new THREE.PointLight(0xf2f4ff, 0, 9, 1.6); scene.add(l); return l; });
let lampsOn = true;
const torch = new THREE.SpotLight(0xfff2d8, 0, 28, .45, .5, 1.4); torch.castShadow = true; torch.shadow.mapSize.set(1024, 1024); torch.shadow.bias = -.0008; cam.add(torch); cam.add(torch.target); torch.target.position.set(0, 0, -1); scene.add(cam);
const P = { x: -40, z: -1.3, y: 0, vy: 0, yaw: -Math.PI / 2, pitch: 0 }, keys = {};
addEventListener('keydown', e => { keys[e.code] = 1; if (e.code === 'KeyF') torch.intensity = torch.intensity ? 0 : 40; if (e.code === 'KeyL') lampsOn = !lampsOn; if (e.code === 'KeyE') { const d = B.nearDoor(P.x, P.z, P.y); if (d) d.target = d.target ? 0 : 1; } if (/Digit[1-4]/.test(e.code)) { const f = +e.code.slice(5) - 1; P.y = f * B.spec.FH; P.vy = 0; P.z = -1.3; } });
addEventListener('keyup', e => keys[e.code] = 0);
document.getElementById('go').onclick = () => R.domElement.requestPointerLock();
document.addEventListener('pointerlockchange', () => document.getElementById('go').style.display = document.pointerLockElement ? 'none' : 'flex');
addEventListener('mousemove', e => { if (!document.pointerLockElement) return; P.yaw -= e.movementX * .0022; P.pitch = Math.max(-1.4, Math.min(1.4, P.pitch - e.movementY * .0022)); });
const C = new EffectComposer(R); C.addPass(new RenderPass(scene, cam)); const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .08, .3, .985); C.addPass(bloom); C.addPass(new OutputPass());
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); R.setSize(innerWidth, innerHeight); C.setSize(innerWidth, innerHeight); });
const RAD = .3, EYE = 1.6;
const blocked = (x, z, y) => B.blocked(x, z, y, RAD);
let last = performance.now();
function tick(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const sp = (keys.ShiftLeft ? 5.2 : 2.8) * dt, fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw);
  let mx = 0, mz = 0; if (keys.KeyW) { mx += fx; mz += fz; } if (keys.KeyS) { mx -= fx; mz -= fz; } if (keys.KeyA) { mx += fz; mz -= fx; } if (keys.KeyD) { mx -= fz; mz += fx; }
  const ml = Math.hypot(mx, mz); if (ml) { mx *= sp / ml; mz *= sp / ml; }
  const tryMove = (nx, nz) => { const g = B.groundAt(nx, nz, P.y); if (g == null) return false; const ny = Math.max(P.y, g); if (blocked(nx, nz, ny)) return false; P.x = nx; P.z = nz; return true; };
  if (!tryMove(P.x + mx, P.z + mz)) { tryMove(P.x + mx, P.z) || tryMove(P.x, P.z + mz); }
  const g = B.groundAt(P.x, P.z, P.y); if (g != null) { if (P.y < g + .001 || P.y - g < .5) { P.y += (g - P.y) * Math.min(1, dt * 14); P.vy = 0; } else { P.vy -= 9.8 * dt; P.y = Math.max(g, P.y + P.vy * dt); } }
  B.tickDoors(dt); { const d = B.nearDoor(P.x, P.z, P.y); document.getElementById('hint').textContent = d ? `[E] ${d.label} ${d.target ? '닫기' : '열기'}` : ''; }
  cam.position.set(P.x, P.y + EYE, P.z); cam.rotation.set(P.pitch, P.yaw, 0, 'YXZ');
  // 가까운 형광등 10개
  const near = B.lights.map(l => [l, (l.x - P.x) ** 2 + (l.z - P.z) ** 2 + ((l.y - P.y - 2) * 3) ** 2]).sort((a, b) => a[1] - b[1]).slice(0, pool.length);
  pool.forEach((pl, i) => { const n = near[i]; if (!n || !lampsOn) { pl.intensity = 0; return; } pl.position.set(n[0].x, n[0].y, n[0].z); pl.intensity = 3.6; });
  const f = Math.round(P.y / B.spec.FH);
  document.getElementById('where').textContent = `${f + 1}층 · ${B.where(P.x, P.z, f)}  (x ${P.x.toFixed(1)}, z ${P.z.toFixed(1)})`;
  C.render(); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.__rb = { B, P, cam, R, scene, MAIN, ANX, WK };
</script>
</body></html>
