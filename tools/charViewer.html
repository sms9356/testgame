<!doctype html><html><head><meta charset="utf-8"><title>Character Viewer</title>
<style>html,body{margin:0;background:#2a2c30}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js"}}</script></head><body>
<script type="module">
// 캐릭터 GLB 단독 뷰어 (재질·애니메이션 확인용): tools/charViewer.html?c=mina&view=front|side|back|face&clip=idle
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/addons/loaders/GLTFLoader.js';
import { createNPCVisuals } from '../npcVisuals.js';
const q = new URLSearchParams(location.search), c = q.get('c') || 'mina', view = q.get('view') || 'front';
const W = 720, H = 960, r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H);
r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x2a2c30);
sc.add(new THREE.HemisphereLight(0xdfe6f0, 0x302a26, .6));
const key = new THREE.DirectionalLight(0xfff1e0, 2.6); key.position.set(2, 3, 3); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; Object.assign(key.shadow.camera, { left: -1.2, right: 1.2, top: 2.2, bottom: -.2, near: .5, far: 10 }); sc.add(key);
const fill = new THREE.DirectionalLight(0xbcd0ff, .8); fill.position.set(-3, 1.5, 1.5); sc.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(0, 2.5, -3); sc.add(rim);
window.__THREE = THREE;
const nv = createNPCVisuals({ THREE, GLTFLoader });
const holder = new THREE.Group(); sc.add(holder); window.__holder = holder;
const cam = new THREE.PerspectiveCamera(view === 'face' ? 16 : 30, W / H, .05, 50);
const res = await nv.load(c, holder, { url: '../assets/characters/' + c + '.glb', native: true, clipNames: [q.get('clip') || 'idle'] });
const _nt = holder.getObjectByName('Mina_NameTag'), _em = holder.getObjectByName('Mina_Emblem'); holder.updateMatrixWorld(true); window.__res = { ...res, nameTag: _nt && _nt.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)), emblem: _em && new THREE.Box3().setFromObject(_em).getCenter(new THREE.Vector3()).toArray().map(v => +v.toFixed(3)) };
const steps = +(q.get('t') || 45);
for (let i = 0; i < steps; i++) nv.update(1 / 30);
holder.updateMatrixWorld(true);
const b = new THREE.Box3().setFromObject(holder), h = b.max.y - b.min.y;
const head = holder.getObjectByName('head'); const hp = new THREE.Vector3(); head && head.getWorldPosition(hp);
if (view === 'front') { cam.position.set(0, h * .55, 4.2); cam.lookAt(0, h * .5, 0); }
else if (view === 'side') { cam.position.set(4.2, h * .55, 0); cam.lookAt(0, h * .5, 0); }
else if (view === 'back') { cam.position.set(0, h * .55, -4.2); cam.lookAt(0, h * .5, 0); }
else if (view === 'chest') { cam.position.set(hp.x + .2, hp.y - .25, hp.z + 1.3); cam.lookAt(hp.x, hp.y - .3, hp.z); }
else { const fy = hp.y + (c === 'guard' ? .02 : .08); cam.position.set(hp.x + .2, fy, hp.z + 1.2); cam.lookAt(hp.x, fy, hp.z); }
await new Promise(r => setTimeout(r, 1000));
nv.update(1 / 30); r.render(sc, cam);
window.__ready = true;
</script></body></html>
